<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>A Rose for You</title>
<style>
*, *::before, *::after {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}
html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #080306;
}
body {
    background: 
        radial-gradient(circle at 50% 35%, 
            #3b1424 0%, 
            #170711 50%, 
            #050204 100%
        );
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: Georgia, serif;
    color: white;
}
/* ÁNH SÁNG NỀN TỎA RA */
.glow {
    position: fixed;
    width: min(85vw, 700px);
    aspect-ratio: 1;
    border-radius: 50%;
    background: radial-gradient(
        circle,
        rgba(255, 45, 105, 0.22) 0%,
        rgba(190, 15, 65, 0.08) 45%,
        transparent 75%
    );
    animation: glowPulse 5s ease-in-out infinite;
    pointer-events: none;
    z-index: 1;
}
/* KHU VỰC HOA HỒNG */
.rose-scene {
    width: min(92vw, 480px);
    height: min(90vh, 620px);
    position: relative;
    z-index: 3;
    display: flex;
    align-items: center;
    justify-content: center;
    animation: roseAppear 2s cubic-bezier(0.16, 1, 0.3, 1) both;
}
.rose-svg {
    width: 100%;
    height: 100%;
    overflow: visible;
    filter: drop-shadow(0 0 25px rgba(255, 30, 95, 0.35));
}
.rose-head {
    transform-origin: 220px 225px;
    animation: roseBloom 4s ease-in-out infinite;
}
.petal-detail {
    fill: none;
    stroke: rgba(255, 205, 215, 0.6);
    stroke-width: 1.5;
    stroke-linecap: round;
}
.rose-leaves {
    transform-origin: 220px 390px;
    animation: leafSway 6s ease-in-out infinite;
}
/* HẠT SÁNG NỀN (BOKEH) */
.sparkle {
    position: fixed;
    width: 4px;
    height: 4px;
    border-radius: 50%;
    background: #ffecf2;
    box-shadow: 0 0 12px 4px rgba(255, 90, 140, 0.7);
    pointer-events: none;
    animation: sparkle 3.5s ease-in-out infinite;
    z-index: 2;
}
/* CANVAS CÁNH HOA RƠI */
#petals {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
    z-index: 4;
}
/* DÒNG CHỮ THÔNG ĐIỆP */
.caption {
    position: fixed;
    z-index: 5;
    bottom: max(32px, 6vh);
    left: 0;
    width: 100%;
    text-align: center;
    padding: 0 16px;
    animation: textAppear 2.5s cubic-bezier(0.16, 1, 0.3, 1) both;
    animation-delay: 0.5s;
}
.caption h1 {
    font-size: clamp(24px, 5vw, 36px);
    font-weight: normal;
    font-style: italic;
    letter-spacing: 4px;
    color: #fff0f3;
    text-shadow: 0 0 20px rgba(255, 75, 125, 0.85);
}
.caption p {
    margin-top: 10px;
    font-family: Arial, sans-serif;
    font-size: 11px;
    letter-spacing: 6px;
    color: rgba(255, 210, 222, 0.75);
    text-transform: uppercase;
    text-shadow: 0 0 10px rgba(255, 255, 255, 0.3);
}
/* HIỆU ỨNG ANIMATION */
@keyframes roseBloom {
    0%, 100% {
        transform: scale(0.97) rotate(-1deg);
    }
    50% {
        transform: scale(1.04) rotate(1.5deg);
    }
}
@keyframes leafSway {
    0%, 100% {
        transform: rotate(-1.5deg);
    }
    50% {
        transform: rotate(2.5deg);
    }
}
@keyframes glowPulse {
    0%, 100% {
        opacity: 0.5;
        transform: scale(0.9);
    }
    50% {
        opacity: 0.95;
        transform: scale(1.1);
    }
}
@keyframes sparkle {
    0%, 100% {
        opacity: 0.1;
        transform: scale(0.5);
    }
    50% {
        opacity: 0.9;
        transform: scale(1.4);
    }
}
@keyframes roseAppear {
    from {
        opacity: 0;
        transform: translateY(35px) scale(0.7);
    }
    to {
        opacity: 1;
        transform: translateY(0) scale(1);
    }
}
@keyframes textAppear {
    from {
        opacity: 0;
        transform: translateY(20px);
    }
    to {
        opacity: 1;
        transform: translateY(0);
    }
}
@media (max-width: 480px) {
    .rose-scene {
        width: 100vw;
        height: 75vh;
    }
    .caption h1 {
        letter-spacing: 2px;
    }
    .caption p {
        letter-spacing: 4px;
    }
}
@media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
    }
}
</style>
</head>

<!-- CÁNH HOA BAY TRÊN NỀN -->
<canvas id="petals"></canvas>
<script>
(function () {
    const canvas = document.getElementById("petals");
    const ctx = canvas.getContext("2d");

    let width = 0;
    let height = 0;
    let petals = [];

    const isMobile = window.innerWidth < 600;
    const PETAL_COUNT = isMobile ? 22 : 40;

    function resize() {
        const dpr = Math.min(window.devicePixelRatio || 1, 2);
        width = window.innerWidth;
        height = window.innerHeight;

        canvas.width = width * dpr;
        canvas.height = height * dpr;
        canvas.style.width = width + "px";
        canvas.style.height = height + "px";

        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }
    function createPetal(randomY = false) {
        return {
            x: Math.random() * width,
            y: randomY ? Math.random() * height : height + 30,
            size: 5 + Math.random() * 8,
            speedY: 0.4 + Math.random() * 0.8,
            speedX: (Math.random() - 0.5) * 1.2,
            rotation: Math.random() * Math.PI * 2,
            spin: (Math.random() - 0.5) * 0.03,
            alpha: 0.4 + Math.random() * 0.5,
            sway: Math.random() * 0.015
        };
    }
    function drawPetal(p) {
        ctx.save();
        ctx.translate(p.x, p.y);
        ctx.rotate(p.rotation);
        ctx.globalAlpha = p.alpha;

        const gradient = ctx.createLinearGradient(-p.size, -p.size, p.size, p.size);
        gradient.addColorStop(0, "#ffe3ec");
        gradient.addColorStop(0.45, "#ff4b7d");
        gradient.addColorStop(1, "#9e0535");

        ctx.fillStyle = gradient;
        ctx.beginPath();
        ctx.moveTo(0, -p.size);
        ctx.bezierCurveTo(p.size * 1.6, -p.size * 0.7, p.size * 1.4, p.size * 0.9, 0, p.size);
        ctx.bezierCurveTo(-p.size * 1.4, p.size * 0.9, -p.size * 1.6, -p.size * 0.7, 0, -p.size);
        ctx.fill();

        ctx.restore();
    }
    function init() {
        resize();
        petals = [];
        for (let i = 0; i < PETAL_COUNT; i++) {
            petals.push(createPetal(true));
        }
        requestAnimationFrame(animate);
    }
    function animate() {
        ctx.clearRect(0, 0, width, height);
        for (const p of petals) {
            p.y -= p.speedY;
            p.x += p.speedX + Math.sin(p.y * p.sway) * 0.4;
            p.rotation += p.spin;

            if (p.y < -40 || p.x < -50 || p.x > width + 50) {
                Object.assign(p, createPetal(false));
            }
            drawPetal(p);
        }
        requestAnimationFrame(animate);
    }
    window.addEventListener("resize", resize);
    init();
})();
/* TẠO CÁC ĐIỂM SÁNG LẤP LÁNH NỀN */
(function () {
    const total = window.innerWidth < 600 ? 16 : 28;
    for (let i = 0; i < total; i++) {
        const dot = document.createElement("span");
        dot.className = "sparkle";
        dot.style.left = Math.random() * 100 + "%";
        dot.style.top = Math.random() * 100 + "%";
        dot.style.animationDelay = Math.random() * 4 + "s";
        dot.style.animationDuration = (2.5 + Math.random() * 3.5) + "s";
        dot.style.transform = "scale(" + (0.4 + Math.random() * 0.8) + ")";
        document.body.appendChild(dot);
    }
})();
</script>
